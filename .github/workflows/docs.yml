name: Docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check generated entity document
        run: python material/parser_entities.py --check

      - name: Check local links and assets
        run: python scripts/check_local_links.py

      - name: Run checker tests
        run: python -m unittest discover -s tests -v

      - name: Check Markdown structure
        run: >-
          npx --yes markdownlint-cli2@0.18.1
          README.md CONTRIBUTING.md CHANGELOG.md CODE_OF_CONDUCT.md
          SECURITY.md SUPPORT.md "docs/*.md" "material/**/*.md"
